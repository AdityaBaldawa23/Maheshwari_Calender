<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-label="नमूना विज्ञापन">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7A1F2B"/>
      <stop offset="1" stop-color="#B4532A"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.6" fill="#F4D58D" opacity="0.35"/>
    </pattern>
  </defs>
  <rect width="640" height="320" fill="url(#bg)"/>
  <rect width="640" height="320" fill="url(#dots)"/>
  <rect x="18" y="18" width="604" height="284" rx="14" fill="none" stroke="#F4D58D" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>
  <g fill="#F4D58D" transform="translate(320 120)">
    <circle r="34" fill="none" stroke="#F4D58D" stroke-width="4"/>
    <g id="petal"><path d="M0-58 C10-44 10-40 0-30 C-10-40 -10-44 0-58Z"/></g>
    <use href="#petal" transform="rotate(45)"/><use href="#petal" transform="rotate(90)"/>
    <use href="#petal" transform="rotate(135)"/><use href="#petal" transform="rotate(180)"/>
    <use href="#petal" transform="rotate(225)"/><use href="#petal" transform="rotate(270)"/>
    <use href="#petal" transform="rotate(315)"/>
    <circle r="14"/>
  </g>
  <text x="320" y="240" text-anchor="middle" font-size="40" font-weight="700" fill="#FFF8EC" font-family="'Noto Sans Devanagari', sans-serif">विज्ञापन हेतु स्थान</text>
  <text x="320" y="278" text-anchor="middle" font-size="22" fill="#F4D58D" font-family="'Noto Sans Devanagari', sans-serif">Advertisement space</text>
</svg>
