<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108">
  <!-- Adaptive-icon foreground on a 108×108 grid; artwork stays inside the 66×66 safe zone.
       Background colour: #7A1F2B. Source of truth for all launcher/store icons. -->
  <!-- calendar page -->
  <rect x="31" y="34" width="46" height="44" rx="6" fill="#FBF5EA"/>
  <!-- saffron header band -->
  <path d="M37 34h34a6 6 0 0 1 6 6v6H31v-6a6 6 0 0 1 6-6z" fill="#E07A1F"/>
  <!-- binding rings -->
  <rect x="41" y="29" width="4.5" height="10" rx="2.25" fill="#F6E7C1"/>
  <rect x="62.5" y="29" width="4.5" height="10" rx="2.25" fill="#F6E7C1"/>
  <!-- sun / lotus motif -->
  <g transform="translate(54 62)" fill="#C2410C">
    <path d="M0-13 L2.6-8 L-2.6-8Z"/>
    <path d="M0-13 L2.6-8 L-2.6-8Z" transform="rotate(45)"/>
    <path d="M0-13 L2.6-8 L-2.6-8Z" transform="rotate(90)"/>
    <path d="M0-13 L2.6-8 L-2.6-8Z" transform="rotate(135)"/>
    <path d="M0-13 L2.6-8 L-2.6-8Z" transform="rotate(180)"/>
    <path d="M0-13 L2.6-8 L-2.6-8Z" transform="rotate(225)"/>
    <path d="M0-13 L2.6-8 L-2.6-8Z" transform="rotate(270)"/>
    <path d="M0-13 L2.6-8 L-2.6-8Z" transform="rotate(315)"/>
  </g>
  <circle cx="54" cy="62" r="6.5" fill="#7A1F2B"/>
  <circle cx="54" cy="62" r="2.5" fill="#F6E7C1"/>
</svg>
